name: no_cooling
version: 1.0.0
description: Diagnose equipment that runs but delivers warm or insufficiently cool air.
triggers: [not cooling, no cooling, warm air, insufficient cooling, AC not cold]
equipment_types: [air_handler, fan_coil, split_system, heat_pump, rooftop_unit]
required_context: [equipment_model, equipment_type, technician_notes]
allowed_tools: [get_job_context, get_equipment_profile, search_service_manuals, search_error_codes, search_verified_repairs, request_technician_measurement, record_measurement, create_diagnostic_hypothesis, escalate_to_human, complete_diagnosis]
required_checks: [thermostat_call, filter_condition, airflow, supply_return_temperature, outdoor_unit_operation]
human_approval_required: [electrical_panel_access, refrigerant_service, component_replacement]
completion_criteria: [ranked_hypotheses, cited_manual_sources, safe_next_action]
escalation_conditions: [electrical_hazard, refrigerant_leak_suspected, no_verified_evidence]
max_steps: 20
