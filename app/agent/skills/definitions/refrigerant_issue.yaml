name: refrigerant_issue
version: 1.0.0
description: Triage symptoms suggesting low charge, leak, pressure, or refrigerant circuit problems.
triggers: [low refrigerant, refrigerant leak, low charge, suction pressure low, high head pressure, discharge pressure, pressure issue, superheat]
equipment_types: [split_system, heat_pump, rooftop_unit, chiller]
required_context: [equipment_model, equipment_type, refrigerant, technician_notes]
allowed_tools: [get_job_context, get_equipment_profile, search_service_manuals, search_error_codes, search_verified_repairs, request_technician_measurement, record_measurement, create_diagnostic_hypothesis, escalate_to_human, complete_diagnosis]
required_checks: [refrigerant_type, suction_pressure, discharge_pressure, superheat_subcooling, leak_indicators]
human_approval_required: [refrigerant_service, recovery_or_charging, electrical_panel_access]
completion_criteria: [pressure_measurement_evidence, cited_manual_sources, qualified-technician-handoff]
escalation_conditions: [refrigerant_service_required, suspected_leak, pressure_out_of_range]
max_steps: 16
