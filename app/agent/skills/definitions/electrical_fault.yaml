name: electrical_fault
version: 1.0.0
description: Triage power, wiring, control-board, fuse, contactor, and electrical fault symptoms.
triggers: [electrical fault, no power, tripped breaker, breaker keeps tripping, breaker tripping, live voltage, burning smell, blown fuse, fuse opens repeatedly, wiring issue, contactor failure, control board]
equipment_types: [air_handler, fan_coil, furnace, split_system, heat_pump, rooftop_unit]
required_context: [equipment_model, equipment_type, technician_notes]
allowed_tools: [get_job_context, get_equipment_profile, search_service_manuals, search_error_codes, search_verified_repairs, request_technician_measurement, record_measurement, create_diagnostic_hypothesis, escalate_to_human, complete_diagnosis]
required_checks: [lockout_tagout, supply_voltage, low_voltage_control, fuse_condition, wiring_condition]
human_approval_required: [electrical_panel_access, live_voltage_measurement, component_replacement]
completion_criteria: [qualified_measurement_evidence, cited_manual_sources, safe_next_action]
escalation_conditions: [shock_hazard, burning_smell, exposed_live_parts, unqualified_personnel]
max_steps: 14
