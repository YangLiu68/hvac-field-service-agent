name: general_hvac_triage
version: 1.0.0
description: Conservative first-pass triage when the reported symptom does not match a specialized HVAC workflow.
triggers: [general HVAC, unknown fault, troubleshooting]
equipment_types: []
required_context: [equipment_model, equipment_type, technician_notes]
allowed_tools: [get_job_context, get_equipment_profile, get_equipment_history, search_service_manuals, search_error_codes, search_verified_repairs, request_technician_measurement, record_measurement, create_diagnostic_hypothesis, escalate_to_human, update_job_status, complete_diagnosis]
required_checks: [symptom_clarification, equipment_identity, safety_conditions]
human_approval_required: [electrical_panel_access, refrigerant_service, component_replacement]
completion_criteria: [evidence_supported_hypothesis, cited_manual_sources, safe_next_action]
escalation_conditions: [missing_equipment_identity, unsafe_condition, insufficient_evidence_after_measurement]
max_steps: 20
