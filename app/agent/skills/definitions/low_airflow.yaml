name: low_airflow
version: 1.0.0
description: Diagnose weak supply airflow, restricted circulation, or low blower performance.
triggers: [low airflow, weak airflow, poor airflow, weak air, airflow restricted]
equipment_types: [air_handler, fan_coil, furnace, rooftop_unit]
required_context: [equipment_model, equipment_type, technician_notes]
allowed_tools: [get_job_context, get_equipment_profile, search_service_manuals, search_error_codes, search_verified_repairs, request_technician_measurement, record_measurement, create_diagnostic_hypothesis, escalate_to_human, complete_diagnosis]
required_checks: [filter_condition, blower_operation, static_pressure, duct_restriction, evaporator_coil_condition]
human_approval_required: [electrical_panel_access, component_replacement]
completion_criteria: [airflow_evidence, cited_manual_sources, safe_next_action]
escalation_conditions: [electrical_hazard, rotating_equipment_hazard, insufficient_measurement_data]
max_steps: 18
