services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: hvac_agent
      POSTGRES_USER: hvac
      POSTGRES_PASSWORD: hvac_dev_password
    ports:
      - "5432:5432"
    volumes:
      - hvac_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hvac -d hvac_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hvac_pgdata:
